# The Braintrust eval gate (spec §15.4). On every pull request that touches prompts/, schema/, lexicon/, extract/,
# verify/ or harness/, the synthetic suite runs through the Braintrust eval action, which posts the comparison with
# the main-branch experiment on the pull request; the gate step then fails the check when a tier A metric regresses
# by more than 2 points or ECE worsens by more than 0.01 against the main-branch baseline. A push to the default
# branch runs the same suite and publishes its report as the new baseline.
name: Eval gate

on:
  pull_request:
    paths:
      - "pipeline/advisor_intel/prompts/**"
      - "pipeline/advisor_intel/schema/**"
      - "pipeline/advisor_intel/lexicon/**"
      - "pipeline/advisor_intel/extract/**"
      - "pipeline/advisor_intel/verify/**"
      - "pipeline/advisor_intel/harness/**"
      - ".github/workflows/eval-gate.yml"
  push:
    branches: [main, master]
    paths:
      - "pipeline/advisor_intel/prompts/**"
      - "pipeline/advisor_intel/schema/**"
      - "pipeline/advisor_intel/lexicon/**"
      - "pipeline/advisor_intel/extract/**"
      - "pipeline/advisor_intel/verify/**"
      - "pipeline/advisor_intel/harness/**"
      - "pipeline/advisor_intel/evals/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # the eval action's comparison comment

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} # the Google provider reads GOOGLE_API_KEY, then the legacy GEMINI_API_KEY
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  ADVISOR_INTEL_EVAL_DATASET: synthetic-calls
  PYDANTIC_AI_NO_BANNER: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  REPORT: .data/evals/reports/advisor-extraction-synthetic-calls-latest.json

jobs:
  synthetic-suite:
    name: Synthetic suite and gate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git metadata lets Braintrust pick the main-branch experiment to compare with
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install the pipeline
        working-directory: pipeline
        run: python -m pip install -e ".[dev]"
      - name: No Braintrust key
        if: env.BRAINTRUST_API_KEY == ''
        run: echo "::warning::BRAINTRUST_API_KEY is not available to this run (a pull request from a fork?); the eval gate did not run"
      - name: Synthetic suite (Braintrust eval action)
        if: env.BRAINTRUST_API_KEY != ''
        uses: braintrustdata/eval-action@v1
        with:
          api_key: ${{ secrets.BRAINTRUST_API_KEY }}
          runtime: python
          root: pipeline
          paths: advisor_intel/evals/eval_extraction.py
        env:
          ADVISOR_INTEL_EVAL_EXPERIMENT: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.event.pull_request.number, github.run_attempt) || format('{0}-{1}', github.ref_name, github.sha) }}
      - name: Gate against the main-branch baseline (no tier A regression > 2 points, ECE not worse by > 0.01)
        if: env.BRAINTRUST_API_KEY != '' && github.event_name != 'push'
        working-directory: pipeline
        run: python -m advisor_intel.evals.gate check --current "$REPORT" --baseline-ref "${{ github.event.repository.default_branch }}" --markdown .data/evals/gate.md
      - name: Publish the baseline for the default branch
        if: env.BRAINTRUST_API_KEY != '' && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        working-directory: pipeline
        run: python -m advisor_intel.evals.gate publish --report "$REPORT" --ref "${{ github.ref_name }}"
      - name: Keep the report
        if: always() && env.BRAINTRUST_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            pipeline/.data/evals/reports/
            pipeline/.data/evals/gate.md
          if-no-files-found: ignore
