[project]
name = "advisor-intel"
version = "0.1.0"
description = "Advisor Call Intelligence: turns a recorded adviser–client call into a reviewed, probabilistic FNA profile and a Monte Carlo forecast."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  # Pinned to a minor version; each upgrade passes the Braintrust gate first (spec §13.2).
  "pydantic-ai-slim[anthropic,openai,google]>=2.57,<2.58",
  "temporalio>=1.34,<1.35",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "rapidfuzz>=3.9",
  "jsonschema>=4.20",  # validates the shared SARS tables in fna_tables/ (§12.7)
  "rank-bm25>=0.2.2",
  "pyyaml>=6",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "braintrust>=0.46.1",
  "gepa>=0.1.4",  # evals/gepa_adapter.py implements the 0.1.x GEPAAdapter (EvaluationBatch.objective_scores)
  "pynini>=2.1.6",
  "venn-abers>=1.4",
  "soundfile>=0.12",
  "pyloudnorm>=0.1",
]

[project.optional-dependencies]
# EmbeddingGemma 2 / Qwen3-Embedding through sentence-transformers (spec §1.3). Without it the
# pipeline falls back to a deterministic hashed embedder so tests and offline runs still work.
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
advisor-intel-worker = "advisor_intel.worker:main"
advisor-intel-api = "advisor_intel.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advisor_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: long-running tests (performance targets, large parity runs)",
  "temporal: needs a Temporal dev server binary (TEMPORAL_CLI_PATH)",
  "postgres: needs local PostgreSQL binaries (initdb/postgres)",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# The rule set every contributor and CI run on; `ruff check` must be clean on the whole pipeline.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PIE", "ISC", "PYI", "PLR0124", "PLW1510", "TRY004", "BLE001"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # en dashes and minus signs are deliberate in prose, and in strings the app mirrors
    "B905",  # zip(strict=) everywhere adds noise where lengths are checked upstream
    "RUF005", "SIM105", "SIM108", "E731",  # concatenation, suppress() and ternary style are left to the author
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # re-exports
"advisor_intel/api/app.py" = ["B008"]  # FastAPI's Depends() in defaults is the framework's idiom
"advisor_intel/fna_engine/_js.py" = ["PLR0124"]  # x != x mirrors JavaScript's NaN test, which this module reproduces
"scripts/*.py" = ["E402"]  # the scripts put the package on sys.path before importing it
"tests/**" = ["E402"]
