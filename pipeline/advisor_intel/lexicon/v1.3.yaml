# Vagueness lexicon (spec §8.2): hedges and vague expressions → priors.
#
# Loaded once per run and pinned in Provenance.lexicon_version. Entries marked "seed" are the spec's
# §8.2 values, kept exactly; the rest extend them to South African adviser–client speech, English and
# Afrikaans. They are defensible starting points, not truth: the nightly propose_lexicon_fit (§11.4)
# re-fits any key with >= 20 advisor edits and opens a pull request, and CI runs the golden cases in
# tests/lexicon_cases.yaml (§8.4). Keep one entry per line so a re-fit is a one-line diff.
#
# Keys are matched after canonicalisation (case, accents, punctuation, hyphens, "60s" → "sixties"),
# so write them in plain lower case. A phrase that misses every key falls back to the nearest key with
# embedding similarity >= params.near_miss_threshold (flag lexicon_near_miss), else to the slot's
# population prior (flag lexicon_miss); both are logged for the weekly lexicon review (§8.3).
version: "1.3"

params:
  near_miss_threshold: 0.8           # §8.3: nearest lexicon key with similarity >= 0.8 supplies a provisional prior
  range_widen_rel: 0.05              # §8.3: AMOUNT_RANGE widened 5% each side
  age_range_widen_years: 0.5         # an age range "60 to 65" is widened half a year each side
  hedge_default_strength: 0.5        # a hedge term not in hedge_strength
  approx_default: {dist: triangular, rel_halfwidth: 0.15}       # an approx word not in approx_words: the number stands
  likelihood_default: {mean: 0.5, low: 0.3, high: 0.7}         # a likelihood word not in likelihood_words, no prior
  certainty_default: {boolean: 0.97, category: 1.0, unknown_word: 0.75}   # §8.3: BOOLEAN p = 0.97 with no certainty word

