risk_questions:
- id: horizon
  dimension: capacity
  question: When will you need to start drawing on the majority of this money?
  options:
  - Within 1 year
  - 1 – 3 years
  - 3 – 5 years
  - 5 – 10 years
  - More than 10 years
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: income-stability
  dimension: capacity
  question: How secure is your current and future income?
  options:
  - Very insecure / no regular income
  - Somewhat insecure (commission, contract)
  - Reasonably secure
  - Secure
  - Very secure, with other income sources
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: emergency
  dimension: capacity
  question: If you lost your income, how long could you cover your expenses from savings (excluding retirement funds)?
  options:
  - Less than 1 month
  - 1 – 3 months
  - 3 – 6 months
  - 6 – 12 months
  - More than 12 months
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: proportion
  dimension: capacity
  question: What proportion of your total investable assets does this investment represent?
  options:
  - More than 75%
  - 50% – 75%
  - 25% – 50%
  - 10% – 25%
  - Less than 10%
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: knowledge
  dimension: tolerance
  question: How would you describe your investment knowledge and experience?
  options:
  - None — I have only used bank savings
  - Limited — some unit trusts or a retirement annuity
  - Moderate — I understand how markets and asset classes work
  - Good — I actively follow and manage investments
  - Advanced — professional or extensive experience
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: objective
  dimension: tolerance
  question: Which statement best describes your main investment objective?
  options:
  - Protect my capital — I cannot accept losses
  - Mostly stability, with some growth
  - A balance of growth and stability
  - Mostly growth, accepting short-term volatility
  - Maximum long-term growth
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: drawdown
  dimension: tolerance
  question: Your R100,000 investment falls to R80,000 in a market crash. What would you do?
  options:
  - Sell everything immediately
  - Sell some to limit further losses
  - Do nothing and wait for recovery
  - Stay invested and review with my adviser
  - Invest more while prices are low
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
- id: tradeoff
  dimension: tolerance
  question: Which range of one-year outcomes on R100,000 would you be most comfortable with?
  options:
  - R99,000 to R107,000
  - R94,000 to R112,000
  - R88,000 to R118,000
  - R80,000 to R126,000
  - R70,000 to R140,000
  scores:
  - 1
  - 2
  - 3
  - 4
  - 5
