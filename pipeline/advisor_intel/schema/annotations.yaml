# Hand-written half of the slot catalog (spec §4). generate.py merges this with the FNA app's
# TypeScript sources (lib/fna/types.ts, catalog.ts, riskProfile.ts) and the FnaDocument defaults to
# produce profile_v1.yaml. Field types, union values, defaults, the expense catalog and the risk
# questions come from the app; this file adds what only people can write: the question, tier,
# population prior, bounds, hints and which FNA outputs a slot feeds.
#
# path syntax: {p} = client | spouse; [] = one row of an FnaDocument list. Inferred unless given:
# value_type / fna_unit (from the field name and TS type), policy, allowed forms and dists,
# categories, fna_default, cardinality and entity type.
#
# Population priors use the FNA default as the median where it is meaningful (§17 default);
# amounts that are often zero are mixtures with a point at 0. Dates and years with uncertainty are
# decimal years.

version: profile_v1

groups:
  people:
    description: Each person's date of birth, work, health and smoking status.
    family: household
  household:
    description: Marital status and regime, and whether the spouse is part of the plan.
    family: household
  dependants:
    description: Children, parents and others who depend on the household, and how long.
    list_entity: dependant
    family: household
  education:
    description: Schooling and tertiary plans for each dependant, and money already saved for them.
    list_entity: dependant
    family: household
  income:
    description: Each person's salary, bonus, other income and payroll deductions.
    family: income_expenses
  income_changes:
    description: Expected changes to a person's income (promotion, retrenchment, going part-time). Forecast only.
    list_entity: income_change
    family: income_expenses
  expenses:
    description: Monthly living expenses, classified into the FNA expense catalog, plus anything that fits no catalog line.
    list_entity: expense
    family: income_expenses
  retirement_funds:
    description: Pension, provident, preservation funds, retirement annuities and annuities in payment.
    list_entity: fund
    family: assets_liabilities
  assets:
    description: Property, vehicles, cash, investments, business interests and what each is earmarked for.
    list_entity: asset
    family: assets_liabilities
  liabilities:
    description: Home loans, vehicle finance, cards, loans and other debt.
    list_entity: liability
    family: assets_liabilities
  policies:
    description: Life, disability, income protection, severe illness, funeral and family income cover.
    list_entity: policy
    family: policies_cover
  policy_terms:
    description: Waiting periods, benefit terms, definitions and escalations of existing policies.
    list_entity: policy
    family: policies_cover
  retirement:
    description: When each person wants to retire, the income they want then, and other retirement income.
    family: goals
  goals:
    description: Other savings goals (travel, a car, a deposit, a wedding) with cost, timing and savings.
    list_entity: goal
    family: goals
  estate:
    description: Wills, executors, guardians, trusts and funeral cost.
    family: policies_cover
  estate_needs:
    description: Extra capital or income the family would need on death, bequests, accrual and ported abatement.
    family: policies_cover
  risk_profile:
    description: The eight investor risk questions (tolerance and capacity).
    family: goals
  engagement:
    description: Why the client came for advice, their objectives and concerns, in their own words.
    family: goals
  events:
    description: Uncertain future events with a cash impact (offshore study, inheritance, property sale, emigration). Forecast only.
    list_entity: event
    family: goals

slots:
  # ------------------------------------------------------------------ people
  - path: "{p}.dateOfBirth"
    group: people
    tier: A
    value_type: date
    forms: [DATE_ABS, AGE]
    question: What is this person's date of birth, or their age today?
    hints:
      - "A stated age ('I'm 52') is returned as AGE; code turns it into a date of birth (1 July of the anchor year minus the age, ±6 months)."
      - "An ID number is not read aloud for this slot: the date of birth is derived from the ID in the CRM or prior FNA."
    prior: {kind: triangular, low: 1950, mode: 1982, high: 2004}
    bounds: [1920, 2026]
    outputs: [life, disability, income-protection, severe-illness, retirement, estate]
    forecast: true
  - path: "{p}.employmentType"
    group: people
    tier: A
    question: How does this person earn their income (salaried, self-employed, commission, contract, retired, not working, student)?
    hints:
      - "A business owner who draws a salary from their own company is self-employed."
      - "Someone who has retired and draws an annuity is retired, even with part-time work."
    prior: {kind: categorical, probs: {salaried: 0.62, self-employed: 0.15, commission: 0.06, contract: 0.07, retired: 0.07, unemployed: 0.02, student: 0.01}}
    outputs: [income-protection, disability, retirement, risk-profile]
    forecast: true
  - path: "{p}.smoker"
    group: people
    tier: B
    question: Does this person smoke (including vaping or occasional cigars)?
    prior: {kind: bernoulli, p: 0.2}
    outputs: [life, severe-illness]
  - path: "{p}.occupation"
    group: people
    tier: C
    question: What is this person's occupation or job title?
  - path: "{p}.employer"
    group: people
    tier: C
    question: Who does this person work for?
  - path: "{p}.healthNotes"
    group: people
    tier: C
    question: What health conditions, treatments or medical history did the person mention?
    hints:
      - "Quote the client; never infer a diagnosis."
  - path: "{p}.hazardousPursuits"
    group: people
    tier: C
    question: Does the person take part in hazardous sports, pursuits or travel (diving, motor racing, flying, high-risk countries)?

  # ------------------------------------------------------------------ household
  - path: household.maritalStatus
    group: household
    tier: A
    question: What is the client's marital status (single, married, life partner, divorced, widowed)?
    prior: {kind: categorical, probs: {single: 0.2, married: 0.55, life-partner: 0.1, divorced: 0.1, widowed: 0.05}}
    outputs: [life, estate, retirement]
  - path: household.maritalRegime
    group: household
    tier: A
    question: If married, under which marital regime (in community of property, antenuptial contract with or without accrual, customary, foreign)?
    hints:
      - "'We signed an ANC' without mention of accrual is anc-accrual only if accrual is said; otherwise return both as hypotheses."
      - "'Married in community' means icop."
    prior: {kind: categorical, probs: {icop: 0.25, anc-accrual: 0.45, anc-no-accrual: 0.15, customary: 0.05, foreign: 0.03, na: 0.07}}
    outputs: [estate, life]
    depends_on: [household.maritalStatus]
  - path: household.includeSpouse
    group: household
    tier: A
    question: Is the spouse or partner part of this plan (are both people being advised together)?
    prior: {kind: bernoulli, p: 0.6}
    outputs: [life, disability, income-protection, retirement, estate]
  - path: household.dateOfMarriage
    group: household
    tier: C
    value_type: date
    forms: [DATE_ABS, DURATION_FROM_ANCHOR]
    question: When did the couple marry?
    bounds: [1950, 2026]

  # ------------------------------------------------------------------ dependants
  - path: dependants[].name
    group: dependants
    tier: C
    question: What is this dependant's name?
  - path: dependants[].relationship
    group: dependants
    tier: A
    question: How is this dependant related to the client (child, parent, sibling, other)?
    prior: {kind: categorical, probs: {child: 0.85, parent: 0.1, sibling: 0.03, other: 0.02}}
    outputs: [life, education, estate]
  - path: dependants[].dateOfBirth
    group: dependants
    tier: A
    value_type: date
    forms: [DATE_ABS, AGE]
    question: What is this dependant's date of birth, or their age today?
    hints:
      - "A school grade gives an age: grade + 6 ('in grade 9' → 15); matric → 18."
      - "Return AGE for a stated age; code turns it into a date of birth."
    prior: {kind: triangular, low: 2002, mode: 2015, high: 2026}
    bounds: [1925, 2027]
    outputs: [life, education, estate]
    forecast: true
  - path: dependants[].gender
    group: dependants
    tier: C
    question: Is this dependant male or female, if it is clear from the conversation ('my daughter', 'he')?
  - path: dependants[].specialNeeds
    group: dependants
    tier: A
    question: Does this dependant have special needs that mean lifelong support?
    prior: {kind: bernoulli, p: 0.03}
    outputs: [life, estate]
  - path: dependants[].dependencyEndAge
    group: dependants
    tier: B
    question: Until what age will this dependant rely on the household financially?
    hints:
      - "'Until she's finished studying' with a known study plan is implied from the tertiary start age plus years."
    prior: {kind: triangular, low: 21, mode: 23, high: 26}
    bounds: [0, 100]
    outputs: [life]
    forecast: true
  - path: dependants[].monthlySupport
    group: dependants
    tier: B
    relative: true
    question: How much does the household pay each month to support this dependant (parents and other non-children)?
    prior: {kind: lognormal, median: 4000, p10: 1500, p90: 12000}
    bounds: [0, 200000]
    outputs: [life, cashflow]
    forecast: true
  - path: dependants[].supportYears
    group: dependants
    tier: B
    question: For how many more years will this support be needed?
    prior: {kind: triangular, low: 3, mode: 10, high: 25}
    bounds: [0, 60]
    outputs: [life]
    forecast: true
  - path: dependants[].notes
    group: dependants
    tier: C
    question: Anything else said about this dependant that matters for the plan?

  # ------------------------------------------------------------------ education
  - path: dependants[].schoolType
    group: education
    tier: B
    question: Does this child attend (or will attend) a public or private school, or no school?
    prior: {kind: categorical, probs: {none: 0.1, public: 0.6, private: 0.3}}
    outputs: [education, life]
  - path: dependants[].schoolFeesAnnual
    group: education
    tier: B
    question: What are this child's school fees per year, including extra costs, in today's money?
    hints:
      - "Monthly fees are converted to annual by code; quote the period as said."
    prior: {kind: lognormal, median: 40000, p10: 8000, p90: 180000}
    bounds: [0, 600000]
    outputs: [education, life]
    forecast: true
  - path: dependants[].tertiary
    group: education
    tier: A
    question: Is this dependant expected to study after school (university, college)?
    hints:
      - "'She might go overseas to study' is a PROBABILITY_EVENT, not a plain yes."
    prior: {kind: bernoulli, p: 0.7}
    outputs: [education, life]
    forecast: true
  - path: dependants[].tertiaryStartAge
    group: education
    tier: A
    question: At what age will this dependant start tertiary study?
    hints:
      - "'Straight after matric' with nothing else means 18 (code applies ±1 year)."
      - "'After a gap year' means 19."
    prior: {kind: triangular, low: 18, mode: 19, high: 21}
    bounds: [15, 40]
    outputs: [education]
    forecast: true
  - path: dependants[].tertiaryYears
    group: education
    tier: A
    question: For how many years will this dependant study?
    prior: {kind: discrete, support: [3, 4, 5, 6], weights: [0.35, 0.4, 0.15, 0.1]}
    bounds: [1, 10]
    outputs: [education]
    forecast: true
  - path: dependants[].tertiaryCostAnnual
    group: education
    tier: A
    question: What will tertiary study cost per year (tuition, books, residence), in today's money?
    hints:
      - "A future-dated cost is deflated to today with education inflation by code; quote the year if said."
      - "A cost in a foreign currency stays in that currency."
    prior: {kind: lognormal, median: 150000, p10: 80000, p90: 300000}
    bounds: [0, 3000000]
    outputs: [education, life]
    forecast: true
  - path: dependants[].educationSavings
    group: education
    tier: B
    question: How much has already been saved for this dependant's education?
    prior: {kind: mixture, components: [[0.5, {kind: point, value: 0}], [0.5, {kind: lognormal, median: 60000, p10: 8000, p90: 400000}]]}
    bounds: [0, 20000000]
    outputs: [education]
    forecast: true
  - path: dependants[].educationSavingsMonthly
    group: education
    tier: B
    question: How much goes into education savings for this dependant each month?
    prior: {kind: mixture, components: [[0.5, {kind: point, value: 0}], [0.5, {kind: lognormal, median: 1500, p10: 300, p90: 6000}]]}
    bounds: [0, 200000]
    outputs: [education, cashflow]
    forecast: true

  # ------------------------------------------------------------------ income
  - path: income.{p}.grossMonthly
    group: income
    tier: A
    relative: true
    question: What is this person's gross monthly salary, including fixed taxable allowances?
    hints:
      - "Keep the basis as said: a take-home (net) figure is returned with basis net and grossed up by code."
      - "An annual package ('R900k a year') keeps period annual; code converts it to monthly."
      - "Bonus and commission go in their own slots."
    prior: {kind: lognormal, median: 45000, p10: 18000, p90: 130000}
    bounds: [0, 3000000]
    outputs: [life, disability, income-protection, severe-illness, retirement, cashflow]
    forecast: true
  - path: income.{p}.annualBonus
    group: income
    tier: B
    relative: true
    question: What bonus or 13th cheque does this person receive per year?
    hints:
      - "A 13th cheque is one month's salary: AMOUNT_RELATIVE to income.{p}.grossMonthly with the words as said."
    prior: {kind: mixture, components: [[0.45, {kind: point, value: 0}], [0.55, {kind: lognormal, median: 60000, p10: 15000, p90: 250000}]]}
    bounds: [0, 20000000]
    outputs: [life, income-protection, retirement, cashflow]
    forecast: true
  - path: income.{p}.otherTaxableMonthly
    group: income
    tier: B
    question: What other taxable income does this person receive each month (rental, commission, freelance, annuity)?
    prior: {kind: mixture, components: [[0.7, {kind: point, value: 0}], [0.3, {kind: lognormal, median: 8000, p10: 2000, p90: 30000}]]}
    bounds: [0, 2000000]
    outputs: [life, income-protection, cashflow]
    forecast: true
  - path: income.{p}.nonTaxableMonthly
    group: income
    tier: B
    question: What non-taxable income does this person receive each month (maintenance received, income protection benefits)?
    prior: {kind: mixture, components: [[0.85, {kind: point, value: 0}], [0.15, {kind: lognormal, median: 4000, p10: 1000, p90: 15000}]]}
    bounds: [0, 1000000]
    outputs: [cashflow]
    forecast: true
  - path: income.{p}.medicalAidPayrollMonthly
    group: income
    tier: C
    question: How much medical aid is deducted from this person's salary each month?
    prior: {kind: mixture, components: [[0.5, {kind: point, value: 0}], [0.5, {kind: lognormal, median: 6000, p10: 2500, p90: 12000}]]}
    bounds: [0, 100000]
    outputs: [cashflow]
    forecast: true
  - path: income.{p}.medicalSchemeMembers
    group: income
    tier: C
    value_type: count
    categories: ["0", "1", "2", "3", "4", "5", "6", "7", "8"]
    question: How many people are on this person's medical scheme (for the medical tax credit)?
    prior: {kind: categorical, probs: {"0": 0.25, "1": 0.2, "2": 0.2, "3": 0.15, "4": 0.12, "5": 0.05, "6": 0.02, "7": 0.005, "8": 0.005}}
    outputs: [cashflow]
    forecast: true
  - path: income.{p}.otherPayrollDeductionsMonthly
    group: income
    tier: C
    question: What other deductions come off this person's payslip each month (union, group risk, staff loans)?
    prior: {kind: mixture, components: [[0.6, {kind: point, value: 0}], [0.4, {kind: lognormal, median: 800, p10: 200, p90: 3000}]]}
    bounds: [0, 500000]
    outputs: [cashflow]
  - path: income.{p}.uifApplies
    group: income
    tier: C
    question: Does UIF apply to this person (an employee)?
    prior: {kind: bernoulli, p: 0.8}
    outputs: [cashflow]
  - path: income.{p}.businessGrowthRate
    group: income
    tier: B
    value_type: rate
    forecast_only: true
    question: For a business owner, how do they expect the business's profit to grow each year, after inflation?
    hints:
      - "'Growing a bit', 'flat', 'struggling' are vague RATE words; code maps them through the lexicon."
    prior: {kind: normal, mean: 0.0, sd: 0.05}
    bounds: [-0.5, 1.0]
    outputs: [retirement]
    forecast: true

  # ------------------------------------------------------------------ income changes (forecast only)
  - path: income.{p}.expectedChange[].description
    group: income_changes
    tier: C
    forecast_only: true
    value_type: text
    question: What change to this person's income is expected (promotion, retrenchment, going part-time, a new job)?
  - path: income.{p}.expectedChange[].occurs
    group: income_changes
    tier: A
    forecast_only: true
    value_type: probability
    question: How likely is this income change to happen?
    prior: {kind: bernoulli, p: 0.5}
    outputs: [retirement, cashflow]
    forecast: true
  - path: income.{p}.expectedChange[].year
    group: income_changes
    tier: B
    forecast_only: true
    value_type: year
    question: In which year would the income change take effect?
    prior: {kind: triangular, low: 2027, mode: 2029, high: 2040}
    bounds: [2026, 2080]
    outputs: [retirement]
    forecast: true
  - path: income.{p}.expectedChange[].newGrossMonthly
    group: income_changes
    tier: A
    forecast_only: true
    value_type: amount
    fna_unit: rand_monthly
    relative: true
    question: What would the person's gross monthly income be after the change, in today's money?
    hints:
      - "'Half of what I earn now' is AMOUNT_RELATIVE to income.{p}.grossMonthly."
    prior: {kind: lognormal, median: 45000, p10: 10000, p90: 130000}
    bounds: [0, 3000000]
    outputs: [retirement, cashflow]
    forecast: true

  # ------------------------------------------------------------------ expenses
  - path: expenses.items[]
    group: expenses
    tier: A
    value_type: amount
    fna_unit: rand_monthly
    relative: true
    question: How much does the household spend each month on this catalog line, in today's money?
    hints:
      - "Classify each budget line into one expense-catalog key; anything that fits no key is a custom expense."
      - "Bond and vehicle repayments, risk premiums and savings are not living expenses: they belong to liabilities, policies and investments."
      - "An annual cost ('R12,000 a year for the car licence and service') keeps period annual; code converts to monthly."
    prior: {kind: lognormal, median: 2500, p10: 400, p90: 12000}
    bounds: [0, 1000000]
    outputs: [life, disability, income-protection, emergency, retirement, cashflow]
    forecast: true
  - path: expenses.custom[].label
    group: expenses
    tier: C
    question: What is this expense that fits no catalog line?
  - path: expenses.custom[].category
    group: expenses
    tier: C
    question: Which expense category does it belong to?
    prior: {kind: categorical, probs: {housing: 0.1, transport: 0.1, household: 0.1, communication: 0.05, insurance: 0.05, medical: 0.1, children: 0.1, personal: 0.2, family: 0.1, other: 0.1}}
  - path: expenses.custom[].amount
    group: expenses
    tier: C
    value_type: amount
    fna_unit: rand_monthly
    question: How much is it per month, in today's money?
    prior: {kind: lognormal, median: 1500, p10: 300, p90: 8000}
    bounds: [0, 1000000]
    outputs: [cashflow, emergency, retirement]
    forecast: true
  - path: expenses.custom[].essential
    group: expenses
    tier: C
    question: Is it an essential expense (it would continue in hard times)?
    prior: {kind: bernoulli, p: 0.5}
    outputs: [emergency, life]
    forecast: true

  # ------------------------------------------------------------------ retirement funds
  - path: retirementFunds[].type
    group: retirement_funds
    tier: A
    question: What kind of retirement fund is this (pension, provident, retirement annuity, preservation fund, living annuity, life annuity)?
    hints:
      - "An RA is retirement-annuity; 'my company fund' is pension or provident: return both if not said."
    prior: {kind: categorical, probs: {pension: 0.25, provident: 0.2, retirement-annuity: 0.35, preservation-pension: 0.05, preservation-provident: 0.05, living-annuity: 0.08, life-annuity: 0.02}}
    outputs: [retirement, estate]
    forecast: true
  - path: retirementFunds[].owner
    group: retirement_funds
    tier: A
    question: Whose fund is this (client or spouse)?
    hints:
      - "'My RA' said by the spouse belongs to the spouse."
    prior: {kind: categorical, probs: {client: 0.65, spouse: 0.35}}
    outputs: [retirement]
    forecast: true
  - path: retirementFunds[].provider
    group: retirement_funds
    tier: B
    question: Which company administers this fund?
  - path: retirementFunds[].name
    group: retirement_funds
    tier: C
    question: What do they call this fund (product or scheme name)?
  - path: retirementFunds[].value
    group: retirement_funds
    tier: A
    question: What is the fund worth today (all components)?
    prior: {kind: lognormal, median: 650000, p10: 80000, p90: 4000000}
    bounds: [0, 200000000]
    outputs: [retirement, life, estate]
    forecast: true
  - path: retirementFunds[].savingsPot
    group: retirement_funds
    tier: B
    question: What is the balance of the two-pot savings component (included in the fund value)?
    prior: {kind: lognormal, median: 25000, p10: 3000, p90: 120000}
    bounds: [0, 20000000]
    outputs: [retirement, emergency]
    forecast: true
  - path: retirementFunds[].employeeMonthly
    group: retirement_funds
    tier: A
    question: How much does the member contribute to this fund each month?
    prior: {kind: mixture, components: [[0.3, {kind: point, value: 0}], [0.7, {kind: lognormal, median: 3500, p10: 1000, p90: 12000}]]}
    bounds: [0, 500000]
    outputs: [retirement, cashflow]
    forecast: true
  - path: retirementFunds[].employerMonthly
    group: retirement_funds
    tier: A
    question: How much does the employer contribute to this fund each month (retirement funding portion)?
    prior: {kind: mixture, components: [[0.45, {kind: point, value: 0}], [0.55, {kind: lognormal, median: 4000, p10: 1200, p90: 14000}]]}
    bounds: [0, 500000]
    outputs: [retirement]
    forecast: true
  - path: retirementFunds[].drawdownRate
    group: retirement_funds
    tier: B
    question: For a living annuity, what share of the capital is drawn as income each year?
    hints:
      - "A monthly income amount with a known capital is converted by code; return the rate only if a rate is said."
    prior: {kind: triangular, low: 0.025, mode: 0.05, high: 0.12}
    bounds: [0.025, 0.175]
    outputs: [retirement]
    forecast: true
  - path: retirementFunds[].beneficiariesNominated
    group: retirement_funds
    tier: B
    question: Have beneficiaries been nominated on this fund?
    prior: {kind: bernoulli, p: 0.6}
    outputs: [estate]
  - path: retirementFunds[].viaPayroll
    group: retirement_funds
    tier: C
    question: Is the member contribution deducted through payroll?
    prior: {kind: bernoulli, p: 0.6}
    outputs: [cashflow]

  # ------------------------------------------------------------------ assets
  - path: assets[].type
    group: assets
    tier: A
    question: What kind of asset is this (home, other property, vehicle, cash, money market, unit trusts, shares, TFSA, endowment, offshore, business interest, loan account, crypto, other)?
    prior: {kind: categorical, probs: {primary-residence: 0.17, residential-property: 0.05, commercial-property: 0.01, vehicle: 0.14, personal-effects: 0.02, cash: 0.2, money-market: 0.05, unit-trust: 0.12, shares: 0.05, tfsa: 0.08, endowment: 0.03, offshore: 0.04, business-interest: 0.02, loan-account: 0.005, crypto: 0.005, other: 0.01}}
    outputs: [estate, emergency, retirement, networth]
    forecast: true
  - path: assets[].owner
    group: assets
    tier: A
    question: Who owns this asset (client, spouse or jointly)?
    hints:
      - "'Our house' is joint; under a marriage in community of property the engine splits 50/50 anyway, so record what was said."
    prior: {kind: categorical, probs: {client: 0.45, spouse: 0.2, joint: 0.35}}
    outputs: [estate]
    forecast: true
  - path: assets[].description
    group: assets
    tier: C
    question: How do they describe this asset ('the flat in Sea Point', 'my Discovery unit trusts')?
  - path: assets[].provider
    group: assets
    tier: C
    question: Which bank, asset manager or platform holds this asset?
  - path: assets[].value
    group: assets
    tier: A
    question: What is this asset worth today?
    hints:
      - "A foreign-currency value stays in its currency; code converts in the forecast."
    prior: {kind: lognormal, median: 300000, p10: 20000, p90: 3500000}
    bounds: [0, 500000000]
    outputs: [estate, emergency, retirement, life, networth]
    forecast: true
  - path: assets[].earmark
    group: assets
    tier: A
    question: What is this asset set aside for (general, emergency, retirement, education, a goal)?
    hints:
      - "'That's for the kids' varsity' → education; 'our rainy-day money' → emergency."
    prior: {kind: categorical, probs: {general: 0.6, emergency: 0.15, retirement: 0.1, education: 0.08, goal: 0.07}}
    outputs: [emergency, education, retirement]
    forecast: true
  - path: assets[].baseCost
    group: assets
    tier: B
    question: What did they pay for this asset (base cost for capital gains tax)?
    prior: {kind: lognormal, median: 200000, p10: 15000, p90: 2500000}
    bounds: [0, 500000000]
    outputs: [estate]
  - path: assets[].monthlyContribution
    group: assets
    tier: B
    question: How much is added to this asset each month?
    prior: {kind: mixture, components: [[0.6, {kind: point, value: 0}], [0.4, {kind: lognormal, median: 2000, p10: 500, p90: 10000}]]}
    bounds: [0, 1000000]
    outputs: [retirement, cashflow]
    forecast: true
  - path: assets[].monthlyIncome
    group: assets
    tier: B
    question: What income does this asset produce each month (rental, dividends)?
    prior: {kind: mixture, components: [[0.85, {kind: point, value: 0}], [0.15, {kind: lognormal, median: 9000, p10: 3000, p90: 25000}]]}
    bounds: [0, 2000000]
    outputs: [cashflow, retirement]
    forecast: true
  - path: assets[].bequeathToSpouse
    group: assets
    tier: B
    question: Does this asset go to the surviving spouse on death (per the will)?
    prior: {kind: bernoulli, p: 0.8}
    outputs: [estate]
  - path: assets[].notes
    group: assets
    tier: C
    question: Anything else said about this asset that matters for the plan?

  # ------------------------------------------------------------------ liabilities
  - path: liabilities[].type
    group: liabilities
    tier: A
    question: What kind of debt is this (home loan, vehicle finance, personal loan, credit card, store card, overdraft, student loan, business loan, tax, other)?
    prior: {kind: categorical, probs: {home-loan: 0.3, vehicle-finance: 0.25, personal-loan: 0.1, credit-card: 0.2, store-card: 0.07, overdraft: 0.04, student-loan: 0.02, business-loan: 0.01, tax: 0.005, other: 0.005}}
    outputs: [life, disability, estate, cashflow]
    forecast: true
  - path: liabilities[].owner
    group: liabilities
    tier: A
    question: Whose debt is this (client, spouse or joint)?
    prior: {kind: categorical, probs: {client: 0.45, spouse: 0.2, joint: 0.35}}
    outputs: [life, estate]
    forecast: true
  - path: liabilities[].lender
    group: liabilities
    tier: C
    question: Who is the lender?
  - path: liabilities[].description
    group: liabilities
    tier: C
    question: How do they describe this debt?
  - path: liabilities[].balance
    group: liabilities
    tier: A
    question: How much is still owed on this debt?
    prior: {kind: lognormal, median: 150000, p10: 8000, p90: 2000000}
    bounds: [0, 200000000]
    outputs: [life, disability, estate, networth]
    forecast: true
  - path: liabilities[].monthlyRepayment
    group: liabilities
    tier: A
    question: What is the monthly repayment on this debt?
    prior: {kind: lognormal, median: 4000, p10: 600, p90: 25000}
    bounds: [0, 2000000]
    outputs: [cashflow, life, income-protection]
    forecast: true
  - path: liabilities[].interestRate
    group: liabilities
    tier: B
    question: What interest rate is charged on this debt (per year)?
    hints:
      - "'Prime' or 'prime plus one' are vague rates: quote them; code resolves prime."
    prior: {kind: triangular, low: 0.08, mode: 0.1075, high: 0.22}
    bounds: [0, 0.6]
    outputs: [cashflow, estate]
    forecast: true
  - path: liabilities[].creditLifeCover
    group: liabilities
    tier: B
    question: Is this debt covered by credit life or bond protection that settles it on death?
    prior: {kind: bernoulli, p: 0.4}
    outputs: [life, estate]
  - path: liabilities[].settleOnDeath
    group: liabilities
    tier: B
    question: Should this debt be settled from capital on death?
    prior: {kind: bernoulli, p: 0.9}
    outputs: [life]
  - path: liabilities[].settleOnDisability
    group: liabilities
    tier: B
    question: Should this debt be settled from capital on disability?
    prior: {kind: bernoulli, p: 0.85}
    outputs: [disability]
  - path: liabilities[].linkedAssetId
    group: liabilities
    tier: B
    value_type: text
    question: Which asset does this debt finance (the home for a bond, the car for vehicle finance)?
    hints:
      - "Return the asset's registry entity id; code links home loans to the primary residence when there is one candidate."

  # ------------------------------------------------------------------ policies
  - path: policies[].type
    group: policies
    tier: A
    question: What kind of cover is this (life, lump-sum disability, income protection, severe illness, funeral, family income benefit)?
    prior: {kind: categorical, probs: {life: 0.35, disability-lump: 0.2, income-protection: 0.15, severe-illness: 0.12, funeral: 0.13, family-income: 0.05}}
    outputs: [life, disability, income-protection, severe-illness, funeral]
  - path: policies[].lifeAssured
    group: policies
    tier: A
    question: Whose life does this policy cover (client or spouse)?
    prior: {kind: categorical, probs: {client: 0.65, spouse: 0.35}}
    outputs: [life, disability, income-protection, severe-illness]
  - path: policies[].insurer
    group: policies
    tier: B
    question: Which insurer issued this policy?
  - path: policies[].cover
    group: policies
    tier: A
    question: What is the lump-sum cover amount (life, disability, severe illness, funeral)?
    prior: {kind: lognormal, median: 1500000, p10: 150000, p90: 6000000}
    bounds: [0, 500000000]
    outputs: [life, disability, severe-illness, funeral, estate]
  - path: policies[].monthlyBenefit
    group: policies
    tier: A
    question: What is the monthly benefit (income protection, family income benefit)?
    prior: {kind: lognormal, median: 25000, p10: 6000, p90: 80000}
    bounds: [0, 5000000]
    outputs: [income-protection, life]
  - path: policies[].beneficiary
    group: policies
    tier: A
    question: Who is the nominated beneficiary (estate, spouse, children, trust, other, business)?
    prior: {kind: categorical, probs: {estate: 0.25, spouse: 0.45, children: 0.15, trust: 0.08, other: 0.04, business: 0.03}}
    outputs: [estate, life]
  - path: policies[].isGroup
    group: policies
    tier: A
    question: Is this an employer group scheme benefit rather than a personal policy?
    hints:
      - "Group cover usually ends when the person leaves the employer."
    prior: {kind: bernoulli, p: 0.35}
    outputs: [life, disability, income-protection]
  - path: policies[].premiumMonthly
    group: policies
    tier: B
    question: What is the monthly premium?
    prior: {kind: lognormal, median: 900, p10: 150, p90: 4000}
    bounds: [0, 500000]
    outputs: [cashflow]
    forecast: true
  - path: policies[].notes
    group: policies
    tier: C
    question: Anything else said about this policy that matters for the plan?

  # ------------------------------------------------------------------ policy terms
  - path: policies[].waitingPeriodMonths
    group: policy_terms
    tier: B
    question: For income protection, what is the waiting period before the benefit pays, in months?
    prior: {kind: discrete, support: [0, 1, 3, 6, 12], weights: [0.05, 0.25, 0.45, 0.15, 0.1]}
    bounds: [0, 24]
    outputs: [income-protection, emergency]
  - path: policies[].benefitToAge
    group: policy_terms
    tier: B
    question: Until what age does the income benefit pay (0 for a temporary benefit)?
    prior: {kind: discrete, support: [60, 63, 65, 70], weights: [0.1, 0.1, 0.65, 0.15]}
    bounds: [0, 100]
    outputs: [income-protection]
  - path: policies[].benefitTermYears
    group: policy_terms
    tier: B
    question: For a family income benefit, for how many years is the income paid?
    prior: {kind: triangular, low: 5, mode: 10, high: 20}
    bounds: [0, 50]
    outputs: [life]
  - path: policies[].accelerated
    group: policy_terms
    tier: B
    question: Is this disability or severe illness benefit accelerated from the life cover (paying it reduces the life cover)?
    prior: {kind: bernoulli, p: 0.4}
    outputs: [life, disability, severe-illness]
  - path: policies[].definition
    group: policy_terms
    tier: B
    question: For disability cover, which definition applies (own occupation, suited occupation, any occupation, functional, activities of daily living)?
    prior: {kind: categorical, probs: {own-occupation: 0.5, suited-occupation: 0.2, any-occupation: 0.1, functional: 0.15, activities-of-daily-living: 0.05}}
    outputs: [disability, income-protection]
  - path: policies[].premiumEscalation
    group: policy_terms
    tier: C
    question: By how much does the premium increase each year?
    prior: {kind: triangular, low: 0.0, mode: 0.06, high: 0.15}
    bounds: [0, 0.3]
    outputs: [cashflow]
  - path: policies[].coverEscalation
    group: policy_terms
    tier: C
    question: By how much does the cover increase each year?
    prior: {kind: triangular, low: 0.0, mode: 0.05, high: 0.12}
    bounds: [0, 0.3]
    outputs: [life]
  - path: policies[].inceptionDate
    group: policy_terms
    tier: C
    value_type: date
    forms: [DATE_ABS, DURATION_FROM_ANCHOR]
    question: When did this policy start?
    bounds: [1960, 2027]

  # ------------------------------------------------------------------ retirement goal
  - path: retirement.{p}.retirementAge
    group: retirement
    tier: A
    question: >-
      At what age does this person intend or expect to stop full-time work?
      Include stated, implied and ranges. Note who proposed the number.
    hints:
      - "'In N years' is DURATION_FROM_ANCHOR from the call; code adds it to the person's age at the call date."
      - "Advisor suggestions are not client goals unless the client agrees."
    prior: {kind: triangular, low: 60, mode: 65, high: 70}
    bounds: [40, 80]
    depends_on: ["{p}.dateOfBirth"]
    outputs: [retirement, life, income-protection]
    forecast: true
  - path: retirement.{p}.planningAge
    group: retirement
    tier: B
    question: To what age should the plan fund retirement income (life expectancy to plan for)?
    prior: {kind: triangular, low: 85, mode: 92, high: 100}
    bounds: [70, 110]
    outputs: [retirement]
    forecast: true
  - path: retirement.{p}.targetMode
    group: retirement
    tier: A
    question: Is the retirement income goal stated as a share of current income (percent) or as a monthly amount?
    hints:
      - "'70% of what I earn' → percent; 'R40,000 a month' or 'about the same as we spend now' → amount."
    prior: {kind: categorical, probs: {percent: 0.6, amount: 0.4}}
    outputs: [retirement]
    forecast: true
  - path: retirement.{p}.targetPercent
    group: retirement
    tier: A
    question: What share of current gross income does this person want in retirement?
    prior: {kind: triangular, low: 0.5, mode: 0.75, high: 1.0}
    bounds: [0.1, 2.0]
    depends_on: ["retirement.{p}.targetMode"]
    outputs: [retirement]
    forecast: true
  - path: retirement.{p}.targetMonthly
    group: retirement
    tier: A
    relative: true
    question: What monthly income does this person want in retirement, in today's money?
    hints:
      - "'About the same as now' or 'a bit less' is AMOUNT_RELATIVE to current monthly spending; code multiplies."
    prior: {kind: lognormal, median: 35000, p10: 15000, p90: 90000}
    bounds: [0, 2000000]
    depends_on: ["retirement.{p}.targetMode"]
    outputs: [retirement]
    forecast: true
  - path: retirement.{p}.otherIncomeMonthly
    group: retirement
    tier: B
    question: What other monthly income will this person have in retirement (rental, a spouse's pension), in today's money?
    prior: {kind: mixture, components: [[0.7, {kind: point, value: 0}], [0.3, {kind: lognormal, median: 8000, p10: 2000, p90: 25000}]]}
    bounds: [0, 2000000]
    outputs: [retirement]
    forecast: true

  # ------------------------------------------------------------------ goals
  - path: goals[].name
    group: goals
    tier: B
    question: What is the goal (overseas trip, new car, deposit on a house, wedding)?
  - path: goals[].cost
    group: goals
    tier: A
    relative: true
    question: What will the goal cost, in today's money?
    hints:
      - "A future-dated cost is deflated to today by code; quote the year if said."
    prior: {kind: lognormal, median: 250000, p10: 30000, p90: 2000000}
    bounds: [0, 500000000]
    outputs: [cashflow]
    forecast: true
  - path: goals[].targetYear
    group: goals
    tier: A
    question: In which year do they want to reach the goal?
    hints:
      - "'In three years' is DURATION_FROM_ANCHOR from the call; code turns it into a calendar year."
    prior: {kind: triangular, low: 2027, mode: 2031, high: 2046}
    bounds: [2026, 2100]
    outputs: [cashflow]
    forecast: true
  - path: goals[].existingSavings
    group: goals
    tier: A
    question: How much is already saved towards this goal?
    prior: {kind: mixture, components: [[0.5, {kind: point, value: 0}], [0.5, {kind: lognormal, median: 50000, p10: 5000, p90: 400000}]]}
    bounds: [0, 500000000]
    outputs: [cashflow]
    forecast: true
  - path: goals[].monthlyContribution
    group: goals
    tier: A
    question: How much is saved towards this goal each month?
    prior: {kind: mixture, components: [[0.5, {kind: point, value: 0}], [0.5, {kind: lognormal, median: 2000, p10: 500, p90: 10000}]]}
    bounds: [0, 1000000]
    outputs: [cashflow]
    forecast: true
  - path: goals[].priority
    group: goals
    tier: B
    question: How important is this goal to them (high, medium, low)?
    prior: {kind: categorical, probs: {high: 0.35, medium: 0.45, low: 0.2}}
  - path: goals[].owner
    group: goals
    tier: B
    question: Whose goal is it (client, spouse or joint)?
    prior: {kind: categorical, probs: {client: 0.3, spouse: 0.1, joint: 0.6}}
    forecast: true

  # ------------------------------------------------------------------ estate
  - path: estate.{p}.hasWill
    group: estate
    tier: A
    question: Does this person have a valid will (yes, no, unsure)?
    hints:
      - "'We did wills years ago, I think' is yes with a certainty word; 'I'm not sure where it is' still means a will exists."
    prior: {kind: categorical, probs: {"yes": 0.45, "no": 0.4, unsure: 0.15}}
    outputs: [estate]
  - path: estate.{p}.willDate
    group: estate
    tier: C
    value_type: date
    forms: [DATE_ABS, DURATION_FROM_ANCHOR]
    question: When was the will signed or last updated?
    bounds: [1950, 2027]
  - path: estate.{p}.willLocation
    group: estate
    tier: C
    question: Where is the original will kept?
  - path: estate.{p}.executor
    group: estate
    tier: C
    question: Who is nominated as executor?
  - path: estate.{p}.guardianNominated
    group: estate
    tier: A
    question: Has a guardian been nominated for minor children (yes, no, not applicable)?
    prior: {kind: categorical, probs: {"yes": 0.3, "no": 0.4, na: 0.3}}
    outputs: [estate]
  - path: estate.{p}.hasTrust
    group: estate
    tier: B
    question: Does this person have (or plan in the will) a trust?
    prior: {kind: bernoulli, p: 0.12}
    outputs: [estate]
  - path: estate.{p}.trustNotes
    group: estate
    tier: C
    question: What was said about the trust (type, trustees, assets)?
  - path: estate.{p}.funeralCost
    group: estate
    tier: B
    question: What would this person's funeral cost?
    prior: {kind: triangular, low: 30000, mode: 50000, high: 120000}
    bounds: [0, 2000000]
    outputs: [funeral, estate]

  # ------------------------------------------------------------------ estate needs
  - path: estate.{p}.additionalIncomeNeedMonthly
    group: estate_needs
    tier: B
    question: What extra monthly income would the family need if this person died (childcare, help at home), in today's money?
    prior: {kind: mixture, components: [[0.8, {kind: point, value: 0}], [0.2, {kind: lognormal, median: 5000, p10: 1500, p90: 15000}]]}
    bounds: [0, 1000000]
    outputs: [life]
  - path: estate.{p}.additionalCapitalNeed
    group: estate_needs
    tier: B
    question: What other lump sums would be needed on this person's death (business debt, a bequest to charity)?
    prior: {kind: mixture, components: [[0.8, {kind: point, value: 0}], [0.2, {kind: lognormal, median: 200000, p10: 30000, p90: 1500000}]]}
    bounds: [0, 500000000]
    outputs: [life, estate]
  - path: estate.{p}.cashBequests
    group: estate_needs
    tier: B
    question: What specific cash bequests does the will leave?
    prior: {kind: mixture, components: [[0.9, {kind: point, value: 0}], [0.1, {kind: lognormal, median: 100000, p10: 10000, p90: 500000}]]}
    bounds: [0, 500000000]
    outputs: [estate]
  - path: estate.{p}.accrualCommencementValue
    group: estate_needs
    tier: B
    question: For a marriage with accrual, what was this person's net estate at the start of the marriage?
    prior: {kind: lognormal, median: 300000, p10: 20000, p90: 2000000}
    bounds: [0, 500000000]
    depends_on: [household.maritalRegime]
    outputs: [estate]
  - path: estate.{p}.portedAbatement
    group: estate_needs
    tier: B
    question: Is there unused estate duty abatement ported from a predeceased spouse, and how much?
    prior: {kind: mixture, components: [[0.97, {kind: point, value: 0}], [0.03, {kind: point, value: 3500000}]]}
    bounds: [0, 3500000]
    outputs: [estate]

  # ------------------------------------------------------------------ risk profile (one slot per question; generated from riskProfile.ts)
  - path: riskProfile.answers[]
    group: risk_profile
    tier: B
    question: "{question}"
    hints:
      - "Answer with the option label the client's words support; a hedge ('fairly', 'I suppose') is the certainty word."
      - "Capacity questions (horizon, emergency) may be implied from other facts: code derives them when not answered."
    outputs: [risk-profile]

  # ------------------------------------------------------------------ engagement (narrative, in the client's words)
  - path: engagement.reasonForAdvice
    group: engagement
    tier: C
    question: Why did the client come for advice now? Quote their own words.
  - path: engagement.clientObjectives
    group: engagement
    tier: C
    question: What does the client want to achieve? Quote their own words.
  - path: engagement.clientConcerns
    group: engagement
    tier: C
    question: What worries the client about their finances? Quote their own words.
  - path: engagement.otherAdvisers
    group: engagement
    tier: C
    question: Which other advisers (attorneys, accountants, other planners) does the client use?

  # ------------------------------------------------------------------ events (forecast only)
  - path: event[].description
    group: events
    tier: C
    forecast_only: true
    value_type: text
    question: What uncertain future event with a cash impact was mentioned (offshore study, inheritance, property sale, emigration, a large purchase)?
  - path: event[].kind
    group: events
    tier: B
    forecast_only: true
    value_type: category
    categories: [education-offshore, inheritance, property-sale, business-sale, large-purchase, emigration, health, family-support, other]
    question: Which kind of event is it?
    prior: {kind: categorical, probs: {education-offshore: 0.15, inheritance: 0.15, property-sale: 0.15, business-sale: 0.05, large-purchase: 0.2, emigration: 0.05, health: 0.05, family-support: 0.1, other: 0.1}}
  - path: event[].occurs
    group: events
    tier: A
    forecast_only: true
    value_type: probability
    question: How likely is the event, in the client's words ('she might go overseas', 'we'll definitely sell')?
    prior: {kind: bernoulli, p: 0.3}
    outputs: [retirement, cashflow]
    forecast: true
  - path: event[].year
    group: events
    tier: B
    forecast_only: true
    value_type: year
    question: In which year would it happen?
    prior: {kind: triangular, low: 2027, mode: 2032, high: 2050}
    bounds: [2026, 2100]
    outputs: [retirement]
    forecast: true
  - path: event[].cashImpact
    group: events
    tier: A
    forecast_only: true
    value_type: amount
    fna_unit: rand
    question: What would it cost (negative) or bring in (positive), in today's money?
    hints:
      - "An inflow such as an inheritance or a sale is positive; a cost is negative. Foreign amounts stay in their currency."
    prior: {kind: lognormal, median: 200000, p10: 30000, p90: 2000000}
    bounds: [-500000000, 500000000]
    outputs: [retirement, cashflow]
    forecast: true

# FnaDocument fields that are deliberately not extracted, with the reason. The catalog check fails
# when the app adds a field that is neither a slot nor listed here.
excluded:
  Person:
    title: identity detail from the CRM, not the conversation
    firstName: identity detail from the CRM, not the conversation
    surname: identity detail from the CRM, not the conversation
    idNumber: identity detail from FICA documents; date of birth and gender are derived from it (§7.6)
    passportNumber: identity detail from FICA documents
    nationality: identity detail from FICA documents
    gender: derived from the ID number (§7.6)
    educationLevel: record-keeping set in the app
    email: contact detail from the CRM
    mobile: contact detail from the CRM
    taxNumber: identity detail from the CRM
  Household:
    physicalAddress: contact detail from the CRM
    city: contact detail from the CRM
    province: contact detail from the CRM
    postalCode: contact detail from the CRM
  Dependant:
    id: row identity, from the entity registry
  Income:
    payeOverrideMonthly: payslip figure the adviser types in
  RetirementFund:
    id: row identity, from the entity registry
    notes: adviser's own notes
  Asset:
    id: row identity, from the entity registry
  Liability:
    id: row identity, from the entity registry
  Policy:
    id: row identity, from the entity registry
    policyNumber: from policy documents and the CRM
  CustomExpense:
    id: row identity, from the entity registry
  OtherGoal:
    id: row identity, from the entity registry
  EstateProfile:
    notes: adviser's own notes
  RiskProfile:
    notes: adviser's own notes
  Engagement:
    meetingDate: set by the app from the call metadata
    meetingType: set by the app from the call metadata
    adviceType: compliance field set by the adviser
    scope: compliance field set by the adviser
    limitations: compliance field set by the adviser
    disclosureLetterProvided: compliance field set by the adviser
    popiaConsent: consent flag set by the adviser
    popiaConsentDate: consent flag set by the adviser
    specialInfoConsent: consent flag set by the adviser
    ficaVerified: verification flag set by the adviser
    clientDeclinedFna: compliance field set by the adviser
    declineReason: compliance field set by the adviser
    conflictsDisclosed: compliance field set by the adviser
    remunerationDisclosed: compliance field set by the adviser
    pepStatus: FICA screening, not the conversation
    marketingOptIn: consent flag set by the adviser
    copyProvided: compliance field set by the adviser
  # Whole interfaces the adviser sets in the app (§1.5): never extracted.
  Assumptions: "*"
  AdviceRecord: "*"
  Recommendation: "*"
  PracticeProfile: "*"
  PlanLevers: "*"
  PersonPlan: "*"
  CoverLever: "*"
  Expenses: "* (items and custom are slots of their own)"
  FnaDocument: "* (top-level containers; their fields are covered by the interfaces above)"
