# Golden cases for the §5.3 grammars (amount, age, product). Run by tests/test_grammars.py in CI.
#
# Each case: text (as the ASR would write it) and kind, then what must hold:
#   values:   reading values that must all be present (amounts and ages as numbers, products as types)
#   exact:    true → the set of reading values equals `values` exactly
#   top:      the value of the highest-weight reading
#   currency, period, scale, rate, key, provider: attributes of the top reading
#   accepted: false → the grammar must reject the text
# A grammar change that breaks a case must update the case in the same pull request (new GRAMMAR_VERSION).
grammar_version: "2"
